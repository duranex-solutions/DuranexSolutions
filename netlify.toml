[build]
  publish = "."

# Security headers (all pages)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"
    # script-src: own script.js plus GA4 (loaded only after consent).
    # style-src: own CSS plus the sha256 hash of the <noscript> menu style in every <head>.
    # connect-src: contact form (Web3Forms) and GA4. If you edit the <noscript> style, regenerate the hash.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'sha256-EHDQCkbTHR7gWo9ASibi3qELHDXbVr+Zg0SbGQ4ke4k='; img-src 'self' data: https://*.googletagmanager.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com; font-src 'self'; connect-src 'self' https://api.web3forms.com https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.g.doubleclick.net https://www.google.com; manifest-src 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Caching: fonts have hashed filenames, so they are safe to cache for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and logos keep their filenames when replaced, so cache for 30 days (not immutable).
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/logos/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# CSS/JS are not fingerprinted, so always revalidate (Netlify serves 304s).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/favicon.ico"
  to = "/assets/logos/favicon.ico"
  status = 301
  force = true

[[redirects]]
  from = "https://duraweb.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.duraweb.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://duratechsoftware.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.duratechsoftware.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.duranexsolutions.com/*"
  to = "https://duranexsolutions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# One URL per page: /websites/index.html -> /websites/
[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301
  force = true

# Internal planning notes must never be public, even if uploaded by mistake.
[[redirects]]
  from = "/AUDIT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PLAN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
